<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Tugas Mahasiswa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>📚 Manajemen Tugas Mahasiswa 📚</h1>

    <form id="taskForm">
      <div class="form-group">
        <label for="taskName">Nama Tugas</label>
        <input type="text" id="taskName" placeholder="Contoh: Praktikum" required>
      </div>

      <div class="form-group">
        <label for="subject">Mata Kuliah</label>
        <input type="text" id="subject" placeholder="Contoh: Pemrograman Web" required>
      </div>

      <div class="form-group">
        <label for="deadline">Deadline Tugas</label>
        <input type="date" id="deadline" required>
      </div>

      <button type="submit">Tambah Tugas</button>
    </form>


    <div class="filter">
      <input type="text" id="searchInput" placeholder="Cari berdasarkan mata kuliah...">
      <select id="statusFilter">
        <option value="all">Semua</option>
        <option value="pending">Belum Selesai</option>
        <option value="completed">Selesai</option>
      </select>
    </div>

    <ul id="taskList"></ul>

    <p id="taskCount"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
